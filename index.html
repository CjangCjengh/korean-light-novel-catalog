<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국 창작 라이트노벨의 출간일, 완결 여부, 작가, 일러스트레이터, 소개와 권별 표지.">
  <meta name="color-scheme" content="light">
  <title>한국 창작 라이트노벨 목록</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <nav aria-label="Language" class="languages">
      <button type="button" data-lang="ko" lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
      <button type="button" data-lang="zh" lang="zh-Hans" aria-pressed="false">中文</button>
    </nav>
    <a href="https://github.com/CjangCjengh/korean-light-novel-catalog" id="repo-link">자료 · 수정 제안</a>
  </header>
  <main>
    <h1 class="sr-only" id="page-title">한국 창작 라이트노벨 목록</h1>
    <form id="search-form" class="searchbar" role="search">
      <label for="search" class="sr-only" id="search-label">검색</label>
      <input id="search" type="search" placeholder="제목, 작가, 일러스트레이터, ISBN" autocomplete="off">
      <label for="search-scope" class="sr-only" id="scope-label">검색 범위</label>
      <select id="search-scope"></select>
      <button type="submit" class="primary" id="search-button">검색</button>
    </form>
    <div class="layout">
      <aside>
        <details id="filters" open>
          <summary id="filters-label">필터</summary>
          <div class="filter-content">
            <fieldset><legend id="status-label">출간 상태</legend><div id="status-options" class="options"></div></fieldset>
            <fieldset><legend id="imprint-label">출판 브랜드</legend><div id="imprint-options" class="options imprints"></div></fieldset>
            <fieldset><legend id="year-label">첫 권 출간 연도</legend><div class="range"><select id="year-from" aria-label="시작 연도"></select><span>–</span><select id="year-to" aria-label="종료 연도"></select></div></fieldset>
            <div class="field"><label for="author" id="author-label">작가</label><input type="search" id="author" list="authors" autocomplete="off"><datalist id="authors"></datalist></div>
            <div class="field"><label for="artist" id="artist-label">일러스트</label><input type="search" id="artist" list="artists" autocomplete="off"><datalist id="artists"></datalist></div>
            <fieldset><legend id="volumes-label">본편 권수</legend><div class="range"><input id="volume-min" type="number" min="0" step="1" aria-label="최소 권수"><span>–</span><input id="volume-max" type="number" min="0" step="1" aria-label="최대 권수"></div></fieldset>
            <fieldset><legend id="extra-label">추가 조건</legend><div id="extra-options" class="options"></div></fieldset>
            <button type="button" id="reset">필터 초기화</button>
          </div>
        </details>
      </aside>
      <section class="results" aria-label="검색 결과">
        <div class="results-top"><p id="result-count" aria-live="polite">불러오는 중…</p><label class="sort-label"><span id="sort-label">정렬</span><select id="sort"></select></label></div>
        <div class="tools"><span id="date-note"></span><button type="button" id="share">검색 링크 복사</button><button type="button" id="export">CSV 저장</button></div>
        <div id="active-filters"></div>
        <div id="works"></div>
        <nav class="pagination" aria-label="Pages"><button id="previous" type="button">이전</button><label><span class="sr-only" id="page-label">페이지</span><select id="page"></select></label><button id="next" type="button">다음</button></nav>
      </section>
    </div>
    <p id="error" role="alert" hidden></p>
  </main>
  <dialog id="cover-dialog">
    <div class="dialog-top"><button id="cover-close" type="button" autofocus>닫기</button></div>
    <img id="large-cover" alt="">
    <p id="cover-caption"></p>
    <div class="dialog-controls"><button id="cover-prev" type="button">←</button><a id="cover-source" target="_blank" rel="noopener noreferrer">서점</a><button id="cover-next" type="button">→</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>이 목록을 검색하려면 JavaScript를 켜 주세요. / Enable JavaScript to search the catalog. / 请启用 JavaScript 查看和检索书目。 <a href="data/catalog.json">JSON</a></noscript>
</body>
</html>
